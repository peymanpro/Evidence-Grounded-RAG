name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RAG_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ragtest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ragtest
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ragtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,pgvector]"
      - run: ruff check .
      - run: pytest
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build container image
        run: docker build --tag evidence-grounded-rag:test .
      - name: Smoke test container health endpoint
        shell: bash
        run: |
          set -euo pipefail
          container_name="evidence-rag-smoke"
          cleanup() {
            docker logs "$container_name" || true
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name "$container_name" -p 127.0.0.1:8765:8000 evidence-grounded-rag:test
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/health; then
              exit 0
            fi
            sleep 1
          done
          echo "Container did not become healthy" >&2
          exit 1
