name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build container image
        run: docker build --tag evidence-grounded-rag:test .
      - name: Smoke test container health endpoint
        shell: bash
        run: |
          set -euo pipefail
          container_name="evidence-rag-smoke"
          cleanup() {
            docker logs "$container_name" || true
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name "$container_name" -p 127.0.0.1:8765:8000 evidence-grounded-rag:test
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/health; then
              exit 0
            fi
            sleep 1
          done
          echo "Container did not become healthy" >&2
          exit 1
