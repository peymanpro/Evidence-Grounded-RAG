name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Test and build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release_version.outputs.version }}
      release_needed: ${{ steps.release_version.outputs.release_needed }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      - name: Lint
        run: ruff check src tests

      - name: Run tests
        run: pytest

      - name: Determine release version
        id: release_version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          print(
              tomllib.loads(
                  Path("pyproject.toml").read_text(encoding="utf-8")
              )["project"]["version"]
          )
          PY
          )"

          if [[ -z "$VERSION" ]]; then
            echo "Could not determine project.version from pyproject.toml."
            exit 1
          fi

          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists; no duplicate release will be created."
          else
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist; a release will be created after validation on main."
          fi

      - name: Build source distribution and wheel
        run: python -m build --sdist --wheel

      - name: Smoke-test built wheel
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/wheel-smoke" dist/*.whl
          PYTHONPATH="$RUNNER_TEMP/wheel-smoke" python -c "import evidence_rag; print(evidence_rag.__file__)"

      - name: Upload release distributions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_version.outputs.release_needed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.validate.outputs.version }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
