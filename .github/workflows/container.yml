name: container

on:
  push:
    branches: [main, "feat/docker-deployment"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_DB: rag_test
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAG_TEST_DATABASE_URL: postgresql://rag:rag@localhost:5432/rag_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: pytest

      - name: Run Ruff
        run: ruff check src tests

  build-and-smoke:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag evidence-grounded-rag:test .

      - name: Start container and verify health endpoint
        run: |
          docker run --detach --name evidence-grounded-rag --publish 8000:8000 evidence-grounded-rag:test
          cleanup() {
            docker logs evidence-grounded-rag || true
            docker rm --force evidence-grounded-rag || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done

          echo "Health endpoint did not become ready within 60 seconds."
          exit 1
