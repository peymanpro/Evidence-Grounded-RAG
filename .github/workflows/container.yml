name: container

on:
  push:
    branches: [main, "feat/docker-deployment"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_DB: rag_test
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAG_TEST_DATABASE_URL: postgresql://rag:rag@localhost:5432/rag_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: pytest

      - name: Run Ruff
        run: ruff check src tests

  build-and-smoke:
    name: Compose stack smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start Compose stack and verify API and pgvector
        run: |
          cleanup() {
            docker compose logs --no-color || true
            docker compose down --volumes --remove-orphans || true
          }
          trap cleanup EXIT

          docker compose up --build --detach

          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8000/health

          readiness_status=$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:8000/ready)
          if [ "$readiness_status" != "503" ]; then
            echo "Expected an unconfigured RAG service to report readiness HTTP 503; got $readiness_status."
            exit 1
          fi

          docker compose exec --no-TTY database psql -U raguser -d ragdb -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector" \
            -c "SELECT extversion FROM pg_extension WHERE extname = 'vector'"
