name: evidence-grounded-rag

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${RAG_PORT:-8000}:8000"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
